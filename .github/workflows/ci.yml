name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install flake8 pytest
          # TODO: cài thêm requirements của crawler/ và dags/ nếu cần cho test
          if [ -f crawler/requirements.txt ]; then pip install -r crawler/requirements.txt; fi

      - name: Lint with flake8
        run: flake8 crawler dags --max-line-length=100

      - name: Run unit tests
        run: pytest -v
